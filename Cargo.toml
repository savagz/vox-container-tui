[package]
name = "voxcontainer-tui"
version = "0.1.2"
edition = "2024"
description = "TUI para administrar instancias LXD/Incus"
repository = "https://github.com/savagz/vox-container-tui"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "process"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
color-eyre = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "5"
chrono = "0.4"
sysinfo = "0.39"
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
