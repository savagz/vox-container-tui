name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        run: |
          file "target/$TARGET/release/voxcontainer-tui"
          if ldd "target/$TARGET/release/voxcontainer-tui" 2>&1 | grep -q "=>"; then
            echo "El binario tiene dependencias dinamicas" >&2
            exit 1
          fi

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="voxcontainer-tui-${tag}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp "target/$TARGET/release/voxcontainer-tui" README.md config/voxcontainer.example.toml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voxcontainer-tui
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" --generate-notes
